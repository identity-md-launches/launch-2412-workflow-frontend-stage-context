<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>swornbyswarm</title>
    <meta
      name="description"
      content="Sworn has moved. Sworn now lives at sworn.sites.imd.fun."
    />
    <meta property="og:title" content="Sworn has moved" />
    <meta
      property="og:description"
      content="This page served Sworn's first public version (swarm launch #2404). Sworn now lives at sworn.sites.imd.fun."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="canonical" href="https://sworn.sites.imd.fun/" />
    <noscript>
      <meta http-equiv="refresh" content="1;url=https://sworn.sites.imd.fun/" />
    </noscript>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --text: #d9e0da;
        --accent: #00ff41;
        --shared: #dbfee6;
        --prose: 0.9375rem;
        --display: 2.125rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 100%;
        line-height: 1.6;
        font-weight: 400;
        background: var(--bg);
        color: var(--text);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-size: var(--prose);
      }
      main {
        max-inline-size: 44rem;
        margin-inline: auto;
        padding-block: clamp(40px, 12vh, 96px);
        padding-inline: 24px;
        overflow-wrap: break-word;
      }
      h1 {
        margin-block: 0 24px;
        font-size: var(--display);
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }
      p {
        margin-block: 0 16px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-block-size: 44px;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      @media (hover: hover) {
        a:hover {
          color: var(--shared);
        }
      }
      a:active {
        color: var(--text);
      }
      a:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sworn has moved</h1>
      <p>This page served Sworn's first public version (swarm launch #2404). Sworn now lives at sworn.sites.imd.fun.</p>
      <a id="open-sworn" href="https://sworn.sites.imd.fun/">Open Sworn</a>
    </main>
    <script>
      const destination = "https://sworn.sites.imd.fun/" + window.location.hash;
      document.getElementById("open-sworn").href = destination;
      window.location.replace(destination);
    </script>
  </body>
</html>
